[workspace]
resolver = "2"
members = [
    "crates/mc-protocol",
    "crates/mc-source-maps",
    "crates/mc-session",
    "adapters/mc-dap-server",
    "adapters/mc-tauri",
    "apps/tauri-standalone/src-tauri",
    "apps/zed-extension",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Svdex"]

[workspace.dependencies]
tokio = { version = "1.52", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
bytes = "1"
sourcemap = "9"

tauri = "2"
tauri-build = "2"
tauri-plugin-opener = "2"

mc-protocol = { path = "crates/mc-protocol" }
mc-source-maps = { path = "crates/mc-source-maps" }
mc-session = { path = "crates/mc-session" }
mc-dap-server = { path = "adapters/mc-dap-server" }
mc-tauri = { path = "adapters/mc-tauri" }
