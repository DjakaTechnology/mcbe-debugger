id = "minecraft-debugger"
name = "Minecraft Bedrock Debugger"
description = "Debug JavaScript running in Minecraft Bedrock via the mc-dap-server sidecar"
version = "0.1.0"
schema_version = 1
authors = ["Svdex"]
repository = "https://github.com/svdex/minecraft-debugger-custom"

[debug_adapters.minecraft-js]
schema_path = "debug_adapter_schemas/minecraft-js.json"

[[capabilities]]
kind = "process:exec"
command = "mc-dap-server"
args = ["**"]
